<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SplitUp Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        :root {
            --bg-color: #f4f6fa;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-gray: #64748b;
            --accent-blue: #007aff;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-green: #10b981;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 0; display: flex; flex-direction: column;
            height: 100vh; box-sizing: border-box; user-select: none; overflow: hidden;
            position: relative;
        }
        .slider-container { width: 100%; height: 100%; overflow: hidden; position: relative; z-index: 10; }
        .slider-wrapper { display: flex; width: 300%; height: 100%; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform; }
        
        .screen { 
            width: 33.3333%; height: 100%; display: flex; flex-direction: column; 
            align-items: center; padding: calc(55px + env(safe-area-inset-top)) 14px calc(95px + env(safe-area-inset-bottom)) 14px; 
            overflow-y: auto; box-sizing: border-box; flex-shrink: 0; -webkit-overflow-scrolling: touch; 
        }
        h1 { font-size: 22px; margin: 5px 0 20px 0; font-weight: 800; letter-spacing: -0.5px; text-align: center; width: 100%; }

        /* МАТРЕШКА ИЗ 3-Х КОЛЕЦ APPLE WATCH (НЕУБИВАЕМЫЙ SVG) */
        .rings-container { position: relative; width: 200px; height: 200px; margin-bottom: 20px; flex-shrink: 0; }
        .rings-svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
        
        /* Базовые параметры пустых дорожек */
        .ring-bg { fill: none; stroke: #e2e8f0; stroke-width: 14; }
        
        /* Активные цветные кольца с плавным заполнением */
        .ring-fill { 
            fill: none; stroke-linecap: round; 
            stroke-dasharray: 440; stroke-dashoffset: 440; 
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        /* Радиусы и толщина для каждого кольца (вложены друг в друга) */
        .ring-fill.income { stroke: var(--accent-green); stroke-width: 14; }
        .ring-fill.expense { stroke: var(--accent-red); stroke-width: 14; }
        .ring-fill.savings { stroke: var(--accent-amber); stroke-width: 14; }

        /* СУТОЧНЫЕ ЛИМИТЫ ПОД КОЛЬЦАМИ */
        .daily-container { display: flex; flex-direction: column; gap: 4px; text-align: center; margin: 0 0 20px 0; font-size: 13px; font-weight: 700; color: var(--text-gray); flex-shrink: 0; }
        .daily-row span { font-weight: 850; font-size: 15px; }
        .daily-row.food-row span { color: var(--accent-blue); }
        .daily-row.fun-row span { color: var(--accent-green); }

        /* ОКНО АССИСТЕНТА (БЕЗ СМАЙЛИКОВ И ЛИШНЕГО ВИЗУАЛЬНОГО МУСОРА) */
        .assistant-card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 16px; padding: 14px; width: 100%; max-width: 380px; box-sizing: border-box; margin-bottom: 15px; font-size: 13px; line-height: 1.45; }
        .assistant-card.crisis { background: #fef2f2; border-color: #fca5a5; }
        .assistant-title { font-weight: 800; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; margin-bottom: 6px; color: var(--text-main); }
        
        /* Кнопка автоматического пересчета лимитов */
        .btn-optimize { width: 100%; background: var(--accent-red); color: #ffffff; border: none; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.3px; margin-top: 10px; outline: none; transition: transform 0.1s; }
        .btn-optimize:active { transform: scale(0.97); }

        /* КАЛЕНДАРНЫЙ СПИСОК ВЫПЛАТ */
        .plan-container { width: 100%; max-width: 380px; display: flex; flex-direction: column; }
        .zone-header { font-size: 13px; color: var(--text-gray); font-weight: 700; text-align: center; margin: 15px 0 10px 0; text-transform: uppercase; }
        .zone-list { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 10px; }
        .plan-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px 14px; border-radius: 14px; display: flex; flex-direction: column; box-shadow: 0 2px 6px rgba(0,0,0,0.01); }
        .plan-card.calendar-card { border-left: 4px solid var(--accent-blue); }
        .plan-card .row-main { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; }
        .plan-card .row-sub { font-size: 12px; color: var(--text-gray); margin-top: 3px; }
        /* ДИНАМИЧЕСКИЕ ТАБЛИЦЫ, ТЕГИ И ЗАКРЕПЛЕННЫЕ ИНПУТЫ */
        .tags-container { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; width: 100%; max-width: 380px; }
        .tag-btn { background: #e2e8f0; border: none; padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; color: var(--text-gray); cursor: pointer; transition: all 0.2s; outline: none; }
        .tag-btn:active { background: #cbd5e1; transform: scale(0.95); }

        .form-box { width: 100%; max-width: 380px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px; box-sizing: border-box; margin-bottom: 12px; position: relative; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; }
        .form-box h3 { margin: 0 0 10px 0; font-size: 13px; text-transform: uppercase; color: var(--text-main); font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        
        .table-head { display: flex; gap: 8px; margin-bottom: 5px; padding: 0 4px; font-size: 10px; color: var(--text-gray); font-weight: 700; text-transform: uppercase; box-sizing: border-box; width: 100%; }
        .list-item-row { display: flex; gap: 8px; margin-bottom: 6px; width: 100%; align-items: center; box-sizing: border-box; }
        
        .th-name { flex: 2; text-align: center; min-width: 0; }
        .list-item-row .f-name { flex: 2; min-width: 0; text-align: left; }
        .th-sum, .list-item-row .f-sum { width: 85px; flex-shrink: 1; min-width: 0; text-align: center; }
        .th-toggle, .list-item-row .f-toggle, .toggle-btn { width: 45px; text-align: center; flex-shrink: 0; }
        .th-space, .btn-delete { width: 24px; text-align: center; flex-shrink: 0; }

        .list-item-row input { background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 8px; padding: 9px; color: var(--text-main); font-size: 13px; outline: none; box-sizing: border-box; font-weight: 500; height: 36px; width: 100%; }
        .list-item-row input:focus { border-color: var(--accent-blue); background: #ffffff; }

        .toggle-btn { height: 34px; border-radius: 8px; border: 1px solid var(--card-border); cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; transition: background 0.2s ease, transform 0.1s; }
        .toggle-btn.pr-1 { background: var(--accent-red) !important; border-color: var(--accent-red) !important; }
        .toggle-btn.pr-2 { background: var(--accent-amber) !important; border-color: var(--accent-amber) !important; }
        .toggle-btn.pr-3 { background: var(--accent-green) !important; border-color: var(--accent-green) !important; }

        .btn-delete { background: none; border: none; color: var(--text-gray); font-size: 15px; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0; }
        .btn-add { width: 100%; background: var(--bg-color); border: 1px dashed var(--card-border); padding: 10px; border-radius: 10px; font-weight: 700; color: var(--accent-blue); cursor: pointer; font-size: 13px; outline: none; margin-bottom: 5px; }

        .legend-box { width: 100%; background: var(--bg-color); border-radius: 10px; padding: 10px; margin-top: 12px; box-sizing: border-box; font-size: 11px; font-weight: 600; color: var(--text-gray); display: flex; flex-direction: column; gap: 5px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="slider-container">
        <div class="slider-wrapper" id="mainSlider">
            
            <!-- ЭКРАН 1: КОЛЬЦА АКТИВНОСТИ APPLE-STYLE, ЛИМИТЫ И РАБОТАЮЩИЙ КАЛЕНДАРЬ -->
            <div class="screen" onclick="handleSideTap(event)">
                <!-- Вложенные кольца активности: Зеленое (внешнее), Красное (среднее), Желтое (внутреннее) -->
                <div class="rings-container">
                    <svg class="rings-svg" viewBox="0 0 160 160">
                        <!-- Внешнее зеленое кольцо (Доход) -->
                        <circle class="ring-bg" cx="80" cy="80" r="70"/>
                        <circle class="ring-fill income" id="ringInc" cx="80" cy="80" r="70"/>
                        
                        <!-- Среднее красное кольцо (Расход) -->
                        <circle class="ring-bg" cx="80" cy="80" r="52" style="stroke-width:12;"/>
                        <circle class="ring-fill expense" id="ringExp" cx="80" cy="80" r="52" style="stroke-width:12;"/>
                        
                        <!-- Внутреннее желтое кольцо (Копилка) -->
                        <circle class="ring-bg" cx="80" cy="80" r="35" style="stroke-width:10;"/>
                        <circle class="ring-fill savings" id="ringSav" cx="80" cy="80" r="35" style="stroke-width:10;"/>
                    </svg>
                </div>

                <!-- Два суточных лимита -->
                <div class="daily-container">
                    <div class="daily-row food-row">На продукты сегодня: <span id="dailyFoodDisplay">0 ₽</span></div>
                    <div class="daily-row fun-row">На досуг сегодня: <span id="dailyFunDisplay">0 ₽</span></div>
                </div>

                <!-- Карточка ассистента -->
                <div class="assistant-card" id="assistantCard">
                    <div class="assistant-title">Финансовый Ассистент</div>
                    <div id="assistantText">Синхронизация бюджетов...</div>
                </div>

                <!-- Жёстко возвращённый и исправленный календарь выплат по датам -->
                <div class="plan-container">
                    <div class="zone-header">Календарный план выплат</div>
                    <div class="zone-list" id="summaryContainer"></div>
                </div>
            </div>

            <!-- ЭКРАН 2: ТАБЛИЦА ДОХОДОВ С ДАТАМИ -->
            <div class="screen" onclick="handleSideTap(event)">
                <h1>Доход:</h1>
                <div class="tags-container">
                    <button class="tag-btn" onclick="addIncomeTemplate('Зарплата', 70000, 15)">+ Зарплата</button>
                    <button class="tag-btn" onclick="addIncomeTemplate('Аванс', 30000, 30)">+ Аванс</button>
                    <button class="tag-btn" onclick="addIncomeTemplate('Подработка', 15000, 5)">+ Подработка</button>
                </div>

                <div class="form-box" style="max-width: 100%;">
                    <div class="table-head">
                        <div class="th-name">Источник</div>
                        <div class="th-sum">Сумма</div>
                        <div class="th-toggle">Дата</div>
                        <div class="th-space"></div>
                    </div>
                    <div id="incomeRowsContainer"></div>
                    <button class="btn-add" onclick="addNewIncomeRow()">+ Добавить</button>
                </div>
            </div>

            <!-- ЭКРАН 3: ФИКСИРОВАННЫЕ ПЛАШКИ "НА ПРОДУКТЫ / НА ДОСУГ" И РАСХОДЫ С ЛЕГЕНДОЙ ВНИЗУ -->
            <div class="screen" onclick="handleSideTap(event)">
                <h1>Расходы</h1>
                
                <!-- Закрепленные ручные инпуты лимитов на продукты и развлечения -->
                <div class="form-box" style="max-width: 100%; padding: 14px 12px; margin-bottom: 12px; background: #fafafa;">
                    <div class="list-item-row" style="margin-bottom: 8px;">
                        <div style="flex: 1; font-size: 13px; font-weight: 700;">На продукты:</div>
                        <div style="width: 110px;">
                            <input type="number" id="limitFoodInput" value="25000" oninput="calculateSplits()" pattern="[0-9]*" inputmode="numeric" style="background:var(--card-bg); border:1px solid var(--card-border); border-radius:8px; padding:8px; text-align:center; font-size:13px; font-weight:700; width:100%; outline:none;">
                        </div>
                    </div>
                    <div class="list-item-row" style="margin-bottom: 0;">
                        <div style="flex: 1; font-size: 13px; font-weight: 700;">На досуг:</div>
                        <div style="width: 110px;">
                            <input type="number" id="limitFunInput" value="15000" oninput="calculateSplits()" pattern="[0-9]*" inputmode="numeric" style="background:var(--card-bg); border:1px solid var(--card-border); border-radius:8px; padding:8px; text-align:center; font-size:13px; font-weight:700; width:100%; outline:none;">
                        </div>
                    </div>
                </div>

                <div class="tags-container">
                    <button class="tag-btn" onclick="addExpenseTemplate('Аренда квартиры', 35000, 1)">+ Аренда</button>
                    <button class="tag-btn" onclick="addExpenseTemplate('Коммуналка', 7000, 1)">+ ЖКХ</button>
                    <button class="tag-btn" onclick="addExpenseTemplate('Проездной', 3000, 2)">+ Транспорт</button>
                </div>

                <div class="form-box" style="max-width: 100%; margin-bottom: 0;">
                    <div class="table-head">
                        <div class="th-name">Расход</div>
                        <div class="th-sum">Сумма</div>
                        <div class="th-toggle">Приор.</div>
                        <div class="th-space"></div>
                    </div>
                    <div id="rowsContainer"></div>
                    <button class="btn-add" onclick="addNewRow()">+ Добавить</button>

                    <div class="legend-box">
                        <div class="legend-item">
                            <div class="legend-dot" style="background:var(--accent-red)"></div>
                            <span>Обязательные платежи</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot" style="background:var(--accent-amber)"></div>
                            <span>Важные платежи</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot" style="background:var(--accent-green)"></div>
                            <span>Свободные траты</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Системные кликабельные точки навигации iOS -->
    <div class="ios-nav-dots">
        <button class="dot active" onclick="moveToScreen(0)" aria-label="Экран 1"></button>
        <button class="dot" onclick="moveToScreen(1)" aria-label="Экран 2"></button>
        <button class="dot" onclick="moveToScreen(2)" aria-label="Экран 3"></button>
    </div>
    <script>
        // Загрузка или создание баз данных доходов и расходов с нативным LocalStorage
        let incomes = JSON.parse(localStorage.getItem('sp_incomes')) || [
            { id: 1, name: 'Зарплата', sum: 70000, payDate: 15 },
            { id: 2, name: 'Аванс', sum: 30000, payDate: 30 }
        ];

        let expenses = JSON.parse(localStorage.getItem('sp_expenses')) || [
            { id: 1, name: 'Аренда квартиры', sum: 35000, priority: 1 },
            { id: 2, name: 'Коммунальные услуги', sum: 7000, priority: 1 },
            { id: 3, name: 'Проездной', sum: 3000, priority: 2 }
        ];

        let currentScreenIndex = 0;

        // Метод моментальной синхронизации с памятью смартфона
        function saveToStorage() {
            localStorage.setItem('sp_incomes', JSON.stringify(incomes));
            localStorage.setItem('sp_expenses', JSON.stringify(expenses));
            localStorage.setItem('sp_limit_food', document.getElementById('limitFoodInput').value);
            localStorage.setItem('sp_limit_fun', document.getElementById('limitFunInput').value);
        }

        // Первичная подгрузка сохранённых ручных плашек при запуске
        window.addEventListener('DOMContentLoaded', () => {
            const savedFood = localStorage.getItem('sp_limit_food');
            const savedFun = localStorage.getItem('sp_limit_fun');
            if (savedFood !== null) document.getElementById('limitFoodInput').value = savedFood;
            if (savedFun !== null) document.getElementById('limitFunInput').value = savedFun;
            
            renderIncomeRows();
            renderRows();
            calculateSplits();
        });

        // Навигация по тапам в левую (назад) или правую (вперед) треть экрана
        function handleSideTap(event) {
            const targetTag = event.target.tagName.toLowerCase();
            if (targetTag === 'input' || targetTag === 'button' || event.target.closest('.btn-delete') || event.target.closest('.toggle-btn') || event.target.closest('.tag-btn') || event.target.closest('.btn-optimize')) {
                return;
            }
            const screenWidth = window.innerWidth;
            const tapX = event.clientX;

            if (tapX < screenWidth * 0.33) {
                if (currentScreenIndex > 0) moveToScreen(currentScreenIndex - 1);
            } else if (tapX > screenWidth * 0.66) {
                if (currentScreenIndex < 2) moveToScreen(currentScreenIndex + 1);
            }
        }

        function moveToScreen(index) {
            currentScreenIndex = index;
            const wrapper = document.getElementById('mainSlider');
            if (wrapper) wrapper.style.transform = `translateX(-${index * 33.3333}%)`;

            for (let i = 0; i <= 2; i++) {
                const dot = document.querySelectorAll('.ios-nav-dots .dot')[i];
                if (dot) {
                    if (i === index) dot.classList.add('active');
                    else dot.classList.remove('active');
                }
            }
        }
        // Вычислительный движок ассистента и расчет длин окружностей колец Apple Watch
        function calculateSplits() {
            let totalIncome = 0;
            let maxIncomeObj = null;
            let maxIncomeSum = -1;

            incomes.forEach(inc => {
                const sumVal = Math.max(0, parseFloat(inc.sum) || 0);
                totalIncome += sumVal;
                if (sumVal > maxIncomeSum) {
                    maxIncomeSum = sumVal;
                    maxIncomeObj = inc;
                }
            });

            // Считаем фиксированные расходы (обязательные 🔴 и важные 🟡 платежи)
            let fixedExpenses = 0;
            expenses.forEach(p => {
                const val = Math.max(0, parseFloat(p.sum) || 0);
                if (p.priority === 1 || p.priority === 2) {
                    fixedExpenses += val;
                }
            });

            // Значения ручных плашек продуктов и досуга
            const foodLimit = Math.max(0, parseFloat(document.getElementById('limitFoodInput').value) || 0);
            const funLimit = Math.max(0, parseFloat(document.getElementById('limitFunInput').value) || 0);

            const totalOutflows = fixedExpenses + foodLimit + funLimit;
            const freeBudget = totalIncome - totalOutflows;

            // Священная заначка (жёлтое кольцо)
            const savingsBuffer = Math.max(0, freeBudget);

            // УПРАВЛЕНИЕ КОЛЬЦАМИ APPLE WATCH ПО ДЛИНЕ ОКРУЖНОСТИ (Длина дуги = 440)
            const maxOffset = 440;
            
            // 1. Зеленое кольцо (Доход) — всегда полное на 100% при наличии денег
            document.getElementById('ringInc').style.strokeDashoffset = totalIncome > 0 ? 0 : maxOffset;
            
            // 2. Красное кольцо (Расход) — заполняется по мере роста трат
            let expPct = totalIncome > 0 ? (fixedExpenses / totalIncome) : 0;
            let expOffset = maxOffset - (Math.min(1, expPct) * maxOffset);
            document.getElementById('ringExp').style.strokeDashoffset = expOffset;
            
            // 3. Желтое кольцо (Копилка) — заполняется от размера чистой заначки
            let savPct = totalIncome > 0 ? (savingsBuffer / totalIncome) : 0;
            let savOffset = maxOffset - (Math.min(1, savPct) * maxOffset);
            document.getElementById('ringSav').style.strokeDashoffset = savOffset;

            // РАСЧЕТ СУТОЧНЫХ НОРМ (НА ЕДУ И НА КАЙФ)
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const daysLeft = Math.max(1, daysInMonth - now.getDate() + 1);

            const dailyFood = Math.round(foodLimit / daysLeft);
            const dailyFun = Math.round(funLimit / daysLeft);

            document.getElementById('dailyFoodDisplay').innerText = `${dailyFood.toLocaleString('ru-RU')} ₽`;
            document.getElementById('dailyFunDisplay').innerText = `${dailyFun.toLocaleString('ru-RU')} ₽`;

            // ТЕКСТОВЫЙ АНАЛИЗ АССИСТЕНТА
            const assistantCard = document.getElementById('assistantCard');
            const assistantText = document.getElementById('assistantText');

            if (freeBudget < 0) {
                const deficit = Math.abs(freeBudget);
                assistantCard.className = "assistant-card crisis";

                const foodCut = Math.round(deficit * 0.35);
                const funCut = Math.round(deficit * 0.65);

                const recommendedFood = Math.max(0, foodLimit - foodCut);
                const recommendedFun = Math.max(0, funLimit - funCut);

                assistantText.innerHTML = `Обнаружен кассовый разрыв: минус ${deficit.toLocaleString('ru-RU')} ₽.<br>
                🤖 Стратегия балансировки без долгов:<br>
                • Обязательные платежи (🔴) зафиксированы за доходом от <b>${maxIncomeObj ? maxIncomeObj.name : 'основного источника'}</b>.<br>
                • Рекомендуется временно снизить плашку продуктов до <b>${recommendedFood.toLocaleString('ru-RU')} ₽</b>, а досуг до <b>${recommendedFun.toLocaleString('ru-RU')} ₽</b>.<br>
                <button class="btn-optimize" onclick="applyIIPPlan(${recommendedFood}, ${recommendedFun})">Применить</button>`;
            } else {
                assistantCard.className = "assistant-card";
                assistantText.innerHTML = `Баланс профицитный. Все лимиты и счета полностью обеспечены.<br>
                Чистый остаток средств в размере <b>${savingsBuffer.toLocaleString('ru-RU')} ₽</b> каскадом перенаправлен в жёлтое кольцо 🟡 (Копилка). Ваши сбережения находятся под защитой.`;
            }

            renderSummary(maxIncomeObj);
            saveToStorage();
        }

        function applyIIPPlan(newFood, newFun) {
            document.getElementById('limitFoodInput').value = newFood;
            document.getElementById('limitFunInput').value = newFun;
            calculateSplits();
        }
        // КАЛЕНДАРНЫЙ ВЫВОД ОТ АССИСТЕНТА: Траты жестко привязываются к датам твоих доходов
        function renderSummary(maxIncomeObj) {
            const container = document.getElementById('summaryContainer');
            if (!container) return;
            container.innerHTML = '';

            if (incomes.length === 0 || expenses.length === 0) {
                container.innerHTML = '<div style="text-align:center; font-size:13px; color:var(--text-gray); padding:20px;">Добавьте доходы и расходы для построения календаря</div>';
                return;
            }

            let remainingExpenses = [...expenses].sort((a, b) => a.priority - b.priority);
            let sortedIncomes = [...incomes].sort((a, b) => {
                if (maxIncomeObj && a.id === maxIncomeObj.id) return -1;
                if (maxIncomeObj && b.id === maxIncomeObj.id) return 1;
                return b.sum - a.sum;
            });

            let allocationMap = {};
            sortedIncomes.forEach(inc => {
                allocationMap[inc.id] = {
                    info: inc,
                    allocatedExpenses: [],
                    availableCash: Math.max(0, parseFloat(inc.sum) || 0)
                };
            });

            remainingExpenses.forEach(exp => {
                let success = false;
                for (let i = 0; i < sortedIncomes.length; i++) {
                    let incId = sortedIncomes[i].id;
                    let bucket = allocationMap[incId];
                    
                    if (bucket.availableCash >= exp.sum) {
                        bucket.allocatedExpenses.push(exp);
                        bucket.availableCash -= exp.sum;
                        success = true;
                        break;
                    }
                }
                if (!success && maxIncomeObj && allocationMap[maxIncomeObj.id]) {
                    allocationMap[maxIncomeObj.id].allocatedExpenses.push(exp);
                    allocationMap[maxIncomeObj.id].availableCash -= exp.sum;
                }
            });

            incomes.forEach(inc => {
                const bucket = allocationMap[inc.id];
                if (!bucket) return;

                const card = document.createElement('div');
                card.className = 'plan-card calendar-card';
                
                let totalGroupSum = 0;
                let listHtml = '';

                bucket.allocatedExpenses.forEach(e => {
                    totalGroupSum += e.sum;
                    let dotColor = e.priority === 1 ? 'var(--accent-red)' : e.priority === 2 ? 'var(--accent-amber)' : 'var(--accent-green)';
                    listHtml += `<div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-gray); margin-top:4px;">
                        <span><span style="color:${dotColor}; margin-right:4px;">●</span>${e.name || 'Без названия'}</span>
                        <span>${e.sum.toLocaleString('ru-RU')} ₽</span>
                    </div>`;
                });

                if (bucket.allocatedExpenses.length === 0) {
                    listHtml = '<div style="font-size:12px; color:var(--text-gray); margin-top:4px; font-style:italic;">Траты не запланированы, весь доход свободен для жизни</div>';
                }

                card.innerHTML = `
                    <div class="row-main">
                        <span style="color:var(--accent-blue)">📅 ${inc.payDate}-е число (${inc.name || 'Доход'})</span>
                        <span>${totalGroupSum.toLocaleString('ru-RU')} ₽</span>
                    </div>
                    <div class="row-sub" style="border-bottom: 1px dashed var(--card-border); padding-bottom: 6px; margin-bottom: 4px; font-weight:700;">
                        Выплаты из этого зачисления:
                    </div>
                    ${listHtml}
                `;
                container.appendChild(card);
            });
        }

        // ОБРАБОТКА ТЕГОВ-ШАБЛОНОВ БЫСТРОГО СТАРТА
        function addIncomeTemplate(name, sum, payDate) {
            const newId = incomes.length > 0 ? Math.max(...incomes.map(i => i.id)) + 1 : 1;
            incomes.push({ id: newId, name, sum, payDate });
            renderIncomeRows();
            calculateSplits();
        }

        function addExpenseTemplate(name, sum, priority) {
            const newId = expenses.length > 0 ? Math.max(...expenses.map(e => e.id)) + 1 : 1;
            expenses.push({ id: newId, name, sum, priority });
            renderRows();
            calculateSplits();
        }

        // РЕНДЕРИНГ И ТАБЛИЧНЫЙ CRUD ОПЕРАЦИИ
        function renderIncomeRows() {
            const container = document.getElementById('incomeRowsContainer');
            if (!container) return;
            container.innerHTML = '';

            incomes.forEach(inc => {
                const row = document.createElement('div');
                row.className = 'list-item-row';
                row.innerHTML = `
                    <div class="f-name"><input type="text" value="${inc.name}" oninput="updateIncome(${inc.id}, 'name', this.value)"></div>
                    <div class="f-sum"><input type="number" value="${inc.sum}" oninput="updateIncome(${inc.id}, 'sum', this.value)"></div>
                    <div class="f-toggle"><input type="number" value="${inc.payDate}" oninput="updateIncome(${inc.id}, 'payDate', this.value)" style="text-align:center;"></div>
                    <button class="btn-delete" onclick="deleteIncome(${inc.id})">✕</button>
                `;
                container.appendChild(row);
            });
        }

        function renderRows() {
            const container = document.getElementById('rowsContainer');
            if (!container) return;
            container.innerHTML = '';

            expenses.forEach(p => {
                const row = document.createElement('div');
                row.className = 'list-item-row';
                let prClass = p.priority === 1 ? 'pr-1' : p.priority === 3 ? 'pr-3' : 'pr-2';

                row.innerHTML = `
                    <div class="f-name"><input type="text" value="${p.name}" oninput="updateParticipant(${p.id}, 'name', this.value)"></div>
                    <div class="f-sum"><input type="number" value="${p.sum}" oninput="updateParticipant(${p.id}, 'sum', this.value)"></div>
                    <div class="f-toggle"><button class="toggle-btn ${prClass}" onclick="cyclePriority(${p.id})"></button></div>
                    <button class="btn-delete" onclick="deleteParticipant(${p.id})">✕</button>
                `;
                container.appendChild(row);
            });
        }

        function updateIncome(id, field, value) {
            const inc = incomes.find(x => x.id === id);
            if (!inc) return;
            if (field === 'sum') inc[field] = Math.max(0, parseFloat(value) || 0);
            else if (field === 'payDate') inc[field] = Math.max(1, Math.min(31, parseInt(value) || 1));
            else inc[field] = value;
            calculateSplits();
        }

        function addNewIncomeRow() {
            const newId = incomes.length > 0 ? Math.max(...incomes.map(i => i.id)) + 1 : 1;
            incomes.push({ id: newId, name: '', sum: 0, payDate: 15 });
            renderIncomeRows();
            calculateSplits();
        }

        function deleteIncome(id) {
            incomes = incomes.filter(x => x.id !== id);
            renderIncomeRows();
            calculateSplits();
        }

        function cyclePriority(id) {
            const p = expenses.find(x => x.id === id);
            if (p) {
                p.priority = p.priority === 3 ? 1 : p.priority + 1;
                renderRows();
                calculateSplits();
            }
        }

        function updateParticipant(id, field, value) {
            const p = expenses.find(x => x.id === id);
            if (!p) return;
            if (field === 'sum') p[field] = Math.max(0, parseFloat(value) || 0);
            else p[field] = value;
            calculateSplits();
        }

        function addNewRow() {
            const newId = expenses.length > 0 ? Math.max(...expenses.map(e => e.id)) + 1 : 1;
            expenses.push({ id: newId, name: '', sum: 0, priority: 2 });
            renderRows();
            calculateSplits();
        }

        function deleteParticipant(id) {
            expenses = expenses.filter(x => x.id !== id);
            renderRows();
            calculateSplits();
        }
    </script>
</body>
</html>
